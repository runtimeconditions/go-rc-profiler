$schema: https://json-schema.org/draft/2020-12/schema
$id: https://runtimeconditions.io/schemas/extension-semantic.v1alpha1.schema.yaml
title: Runtime Conditions extension semantic input
type: object
required:
  - apiVersion
  - kind
  - metadata
  - spec
additionalProperties: false
properties:
  apiVersion:
    const: runtimeconditions.io/v1alpha1
  kind:
    const: RuntimeConditionsExtensionDefinition
  metadata:
    $ref: '#/$defs/metadata'
  spec:
    $ref: '#/$defs/spec'
$defs:
  nonEmptyString:
    type: string
    minLength: 1
  metadata:
    type: object
    required:
      - id
    additionalProperties: false
    properties:
      id:
        type: string
        minLength: 1
        format: uri
      version:
        type: string
        minLength: 1
      semanticSha256:
        type: string
        pattern: '^[0-9a-f]{64}$'
  spec:
    type: object
    minProperties: 1
    additionalProperties: false
    properties:
      dependencies:
        type: array
        x-runtimeconditions-ordering: set
        uniqueItems: true
        items:
          type: string
          minLength: 1
          format: uri
      kinds:
        type: array
        x-runtimeconditions-ordering: set
        items:
          $ref: '#/$defs/kindDefinition'
      interfaceTypes:
        type: array
        x-runtimeconditions-ordering: set
        items:
          $ref: '#/$defs/interfaceTypeDefinition'
      conditionFields:
        type: array
        x-runtimeconditions-ordering: set
        items:
          $ref: '#/$defs/conditionFieldDefinition'
      interfaceFields:
        type: array
        x-runtimeconditions-ordering: set
        items:
          $ref: '#/$defs/interfaceFieldDefinition'
      fieldValues:
        type: array
        x-runtimeconditions-ordering: set
        items:
          $ref: '#/$defs/fieldValuesDefinition'
      schemas:
        type: array
        x-runtimeconditions-ordering: set
        items:
          $ref: '#/$defs/schemaDefinition'
    anyOf:
      - required: [kinds]
      - required: [interfaceTypes]
      - required: [conditionFields]
      - required: [interfaceFields]
      - required: [fieldValues]
      - required: [schemas]
  kindDefinition:
    type: object
    required: [name]
    additionalProperties: false
    properties:
      name:
        $ref: '#/$defs/nonEmptyString'
  interfaceTypeDefinition:
    type: object
    required: [name, targetKind]
    additionalProperties: false
    properties:
      name:
        $ref: '#/$defs/nonEmptyString'
      targetKind:
        $ref: '#/$defs/nonEmptyString'
  conditionFieldDefinition:
    type: object
    required: [name, appliesToKinds]
    additionalProperties: false
    properties:
      name:
        $ref: '#/$defs/nonEmptyString'
      appliesToKinds:
        type: array
        x-runtimeconditions-ordering: set
        minItems: 1
        uniqueItems: true
        items:
          $ref: '#/$defs/nonEmptyString'
      appliesToInterfaceTypes:
        type: array
        x-runtimeconditions-ordering: set
        minItems: 1
        uniqueItems: true
        items:
          $ref: '#/$defs/nonEmptyString'
  interfaceFieldDefinition:
    type: object
    required: [name, targetKind, targetType]
    additionalProperties: false
    properties:
      name:
        $ref: '#/$defs/nonEmptyString'
      targetKind:
        $ref: '#/$defs/nonEmptyString'
      targetType:
        $ref: '#/$defs/nonEmptyString'
  fieldValuesDefinition:
    type: object
    required: [field, targetKind, values]
    additionalProperties: false
    properties:
      field:
        type: string
        minLength: 1
      targetKind:
        $ref: '#/$defs/nonEmptyString'
      targetType:
        $ref: '#/$defs/nonEmptyString'
      values:
        type: array
        x-runtimeconditions-ordering: set
        minItems: 1
        uniqueItems: true
        items:
          $ref: '#/$defs/scalar'
  schemaDefinition:
    type: object
    required: [id, description, schema]
    additionalProperties: false
    properties:
      id:
        $ref: '#/$defs/nonEmptyString'
      description:
        $ref: '#/$defs/nonEmptyString'
      appliesToKind:
        $ref: '#/$defs/nonEmptyString'
      appliesToInterfaceType:
        $ref: '#/$defs/nonEmptyString'
      schema:
        $ref: '#/$defs/jsonSchema'
  scalar:
    type: [string, number, integer, boolean, 'null']
  jsonValue:
    oneOf:
      - $ref: '#/$defs/scalar'
      - type: array
        x-runtimeconditions-ordering: source
        items:
          $ref: '#/$defs/jsonValue'
      - type: object
        additionalProperties:
          $ref: '#/$defs/jsonValue'
  jsonSchema:
    type: object
    additionalProperties:
      $ref: '#/$defs/jsonValue'
    properties:
      $schema:
        const: https://json-schema.org/draft/2020-12/schema
      $id:
        type: string
      $ref:
        type: string
      $dynamicRef:
        type: string
      $defs:
        type: object
        additionalProperties:
          $ref: '#/$defs/jsonSchema'
      type:
        oneOf:
          - type: string
          - type: array
            x-runtimeconditions-ordering: set
            minItems: 1
            uniqueItems: true
            items:
              type: string
      enum:
        type: array
        x-runtimeconditions-ordering: set
        minItems: 1
        uniqueItems: true
        items:
          $ref: '#/$defs/jsonValue'
      const:
        $ref: '#/$defs/jsonValue'
      required:
        type: array
        x-runtimeconditions-ordering: set
        uniqueItems: true
        items:
          type: string
      properties:
        type: object
        additionalProperties:
          $ref: '#/$defs/jsonSchema'
      patternProperties:
        type: object
        additionalProperties:
          $ref: '#/$defs/jsonSchema'
      additionalProperties:
        oneOf:
          - type: boolean
          - $ref: '#/$defs/jsonSchema'
      unevaluatedProperties:
        oneOf:
          - type: boolean
          - $ref: '#/$defs/jsonSchema'
      propertyNames:
        $ref: '#/$defs/jsonSchema'
      dependentSchemas:
        type: object
        additionalProperties:
          $ref: '#/$defs/jsonSchema'
      dependentRequired:
        type: object
        additionalProperties:
          type: array
          x-runtimeconditions-ordering: set
          uniqueItems: true
          items:
            type: string
      items:
        oneOf:
          - type: boolean
          - $ref: '#/$defs/jsonSchema'
      prefixItems:
        type: array
        x-runtimeconditions-ordering: source
        items:
          $ref: '#/$defs/jsonSchema'
      contains:
        $ref: '#/$defs/jsonSchema'
      unevaluatedItems:
        oneOf:
          - type: boolean
          - $ref: '#/$defs/jsonSchema'
      allOf:
        type: array
        x-runtimeconditions-ordering: set
        items:
          $ref: '#/$defs/jsonSchema'
      anyOf:
        type: array
        x-runtimeconditions-ordering: set
        items:
          $ref: '#/$defs/jsonSchema'
      oneOf:
        type: array
        x-runtimeconditions-ordering: set
        items:
          $ref: '#/$defs/jsonSchema'
      not:
        $ref: '#/$defs/jsonSchema'
      if:
        $ref: '#/$defs/jsonSchema'
      then:
        $ref: '#/$defs/jsonSchema'
      else:
        $ref: '#/$defs/jsonSchema'
      examples:
        type: array
        x-runtimeconditions-ordering: source
        items:
          $ref: '#/$defs/jsonValue'

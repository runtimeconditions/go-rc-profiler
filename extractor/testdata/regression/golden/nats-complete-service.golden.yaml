              bucket: configuration
              resource: object_store
            - action: read
              bucket: configuration
              resource: object_store
            - action: inspect
              bucket: configuration
              resource: object_store
            - action: watch
              bucket: configuration
              resource: object_store
            - action: delete
              bucket: retired-configuration
              resource: object_store

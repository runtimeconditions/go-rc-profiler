            - action: publish
              resource: stream
              subject: orders.created
            - action: create
              name: order-worker
              resource: consumer
              stream: ORDERS
            - action: inspect
              name: order-worker
              resource: consumer
              stream: ORDERS
            - action: consume
              name: order-worker
              resource: consumer
              stream: ORDERS
            - action: update
              name: order-worker
              resource: consumer
              stream: ORDERS
            - action: create
              name: stream-worker

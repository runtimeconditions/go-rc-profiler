name: Test

on:
  workflow_call:
  pull_request:
  push:
    branches:
    - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    # The integration tests resolve extensions/ and spec/ as siblings of this
    # checkout, so every repository is placed beside the others under the
    # workspace root rather than at it.
    - uses: actions/checkout@v7
      with:
        path: go-rc-profiler
    - uses: actions/checkout@v7
      with:
        repository: runtimeconditions/extensions
        path: extensions
    - uses: actions/checkout@v7
      with:
        repository: runtimeconditions/spec
        path: spec
    - uses: actions/setup-go@v7
      with:
        go-version-file: go-rc-profiler/go.mod
        cache-dependency-path: go-rc-profiler/go.sum
        cache: true
    - run: go test ./...
      working-directory: go-rc-profiler
    - run: go vet ./...
      working-directory: go-rc-profiler
    - name: Download pinned core profile schema
      run: |
        curl --fail --location \
          https://github.com/runtimeconditions/spec/releases/download/v0.4.0/runtimeconditions.profile.schema.yaml \
          --output "$RUNNER_TEMP/runtimeconditions.profile.schema.yaml"
    - name: Build profiler with verified core profile schema
      working-directory: go-rc-profiler
      run: |
        bash scripts/build-with-core-schema.sh \
          "$RUNNER_TEMP/runtimeconditions.profile.schema.yaml" \
          "$RUNNER_TEMP/go-rc-profiler"
